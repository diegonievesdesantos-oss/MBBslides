name: CI

# Every job runs on a pinned runner image (never ubuntu-latest), with actions on the Node 24
# runtime pinned to commit SHAs. Everything that renders runs INSIDE the reproducible visual
# environment (docker/Dockerfile: pinned base digest, Ubuntu archive snapshot, exact LibreOffice /
# fontconfig / FreeType / HarfBuzz / FriBiDi / font versions, locked Python packages), the same
# image contributors use locally through scripts/cpe-docker. See docs/REPRODUCIBILITY.md.
#
# Private corporate material (.private/) never runs here: it is not in the repository. The sealed
# holdout (the v1.4 sealed suite) never runs here either: it is run once per release candidate, by hand,
# on a frozen engine — running it on every commit would turn it into development data.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # built once per commit by the `image` job, pulled by every job that renders
  IMAGE: ghcr.io/${{ github.repository_owner }}/mbbslides-visual:${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # provenance check needs the evaluated commit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "$(grep '^ruff==' requirements.lock)"
      - run: ruff check src tests scripts
      - name: README numbers match evals/results/latest.json (single source of truth)
        run: PYTHONPATH=src python -m cpe results readme --check
      - name: Recorded results are release truth (clean evaluated commit, engine unchanged since)
        run: PYTHONPATH=src python -m cpe results verify
      - name: Archetype battery cases are generated from scripts/make_archetype_battery.py
        run: python scripts/make_archetype_battery.py --check

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: pip install build==1.6.1 && python -m build
      - name: Installed package works outside the checkout (layouts, themes, profiles packaged)
        run: |
          python -m venv /tmp/venv && /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/cpe catalog > /dev/null && /tmp/venv/bin/cpe themes && /tmp/venv/bin/cpe --help > /dev/null

  image:
    # Builds the reproducible visual environment ONCE and publishes it to GHCR, so the base image is
    # pulled from the upstream mirror once per commit (anonymous mirrors rate-limit parallel pulls).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the visual environment
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          tags: ${{ env.IMAGE }}
          push: true
          cache-from: type=gha,scope=visual
          cache-to: type=gha,scope=visual,mode=max

  tests:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull "$IMAGE"
      - name: Unit, QA-stress, render and reproducibility tests (inside the image)
        run: CPE_IMAGE=$IMAGE scripts/cpe-docker --exec python3 -m pytest -q

  regression:
    # Blocks the merge if the regression suite or the example decks regress.
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull "$IMAGE"
      - name: Public regression suite vs baseline
        run: CPE_IMAGE=$IMAGE scripts/cpe-docker eval --suite regression -o ci_out/regression
      - name: Example decks pass the QA gate
        run: CPE_IMAGE=$IMAGE scripts/cpe-docker eval --suite examples -o ci_out/examples
      - name: Upload renders and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-output
          path: |
            ci_out/**/contact_sheet.png
            ci_out/**/qa_report.md
            ci_out/**/composition.md
            ci_out/*/eval_report.md
            ci_out/*/eval_report.json

  quality_profile:
    # Absolute expectations per archetype on the balanced battery (evals/archetype_gates.json):
    # a relative baseline cannot catch "bad then, equally bad now". Diagnostics and contact sheets
    # of weak archetypes are uploaded with the run.
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull "$IMAGE"
      - name: Render the archetype battery
        run: CPE_IMAGE=$IMAGE scripts/cpe-docker eval --suite regression --match battery -o ci_out/battery
      - name: Quality profile and absolute archetype gates
        run: CPE_IMAGE=$IMAGE scripts/cpe-docker quality ci_out/battery/eval_report.json --check
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-profile
          path: |
            ci_out/battery/eval_report.md
            ci_out/battery/archetype_diagnostics.md
            ci_out/battery/archetype_sheets/*.png

  robustness:
    # Metamorphic robustness: small content perturbations of development seeds. Fails when more
    # variants collapse (≥25-point drop or a new visual QA error) than evals/robustness/baseline.json.
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull "$IMAGE"
      - name: Robustness vs baseline
        run: CPE_IMAGE=$IMAGE scripts/cpe-docker robustness -o ci_out/robustness
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: robustness
          path: ci_out/robustness/robustness_report.*

  reproducibility:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull "$IMAGE"
      - name: Same input, same environment, same engine → identical renders
        run: |
          CPE_IMAGE=$IMAGE scripts/cpe-docker repro examples/alvora/deck.json -o ci_out/repro_alvora
          CPE_IMAGE=$IMAGE scripts/cpe-docker repro examples/gallery/deck.json -o ci_out/repro_gallery
      - name: The environment is the one the recorded results were produced in
        run: CPE_IMAGE=$IMAGE scripts/cpe-docker --exec python3 scripts/check_environment.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility
          path: ci_out/**/repro_report.json

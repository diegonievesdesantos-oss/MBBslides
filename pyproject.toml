[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consulting-presentation-engine"
version = "1.4.0.dev0"
description = "Storyline-first consulting presentation engine: native editable PPTX with render-based QA and a self-correction loop"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = ["python-pptx>=1.0", "Pillow>=10", "lxml>=4.9", "PyMuPDF>=1.24", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
cpe = "cpe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpe = ["design/themes/*.json", "design/profiles.json", "layouts/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 200
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F", "B006", "B008", "I"]
ignore = ["E731"]

[tool.ruff.lint.isort]
known-first-party = ["cpe"]
